[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistic-fingerprints"
version = "0.2.0"
description = "Cross-family and cross-genre generalisation of interpretable LLM version fingerprints"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
