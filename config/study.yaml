project_title: Generalising Linguistic Fingerprints across LLM Families and Genres
design_status: reframed_pending_supervisor_and_pilot
primary_question: >-
  To what extent do linguistically interpretable predecessor-successor
  differences generalise across open-weight model families and text genres?
language: en
prompt_count: 100
task_types:
  explanation: 20
  narrative: 20
  argumentation: 20
  advice: 20
  reflection: 20
target_words:
  min: 120
  max: 150
responses_per_prompt_model: 1
random_seed: 42
spacy_model: en_core_web_sm

generation:
  runtime: ollama
  endpoint: /api/chat
  temperature: 0
  top_p: 1
  top_k: 40
  repeat_penalty: 1
  seed: 42
  num_ctx: 4096
  num_predict: 384
  system_prompt: >-
    Follow the user's writing instruction. Produce only the requested text,
    without discussing the instruction or identifying yourself.

pilot:
  prompts: 20
  expected_responses: 80
  minimum_ok_rate: 0.95
  minimum_length_compliance: 0.80
  maximum_model_refusal_or_format_failure: 0.10

features:
  confirmatory_count: 30
  mattr_window: 50
  manual_audit_fraction: 0.10
  audit_only:
    - n_surface_tokens
    - n_words
    - raw_ttr

inference:
  unit: prompt_id
  contrast: later_minus_earlier_within_family
  bootstrap_repetitions: 10000
  permutation_sidedness: two_sided
  multiple_testing: benjamini_hochberg
  fdr_q: 0.05
  cross_family_direction_summary: prespecified_feature_sign_concordance
  universal_generation_claim_allowed: false

classification:
  estimator: logistic_regression_l2
  C: 1.0
  cv: StratifiedGroupKFold
  cv_folds: 5
  grouping_key: prompt_id
  baseline: stratified_dummy
  protocols:
    within_family_baseline:
      role: supporting
      split: stratified_group_k_fold
      report_separately_by_family: true
    cross_genre:
      role: primary
      split: leave_one_task_type_out
      train_task_types: 4
      test_task_types: 1
      report_separately_by_family: true
    cross_family:
      role: primary
      directions:
        - llama_to_gemma
        - gemma_to_llama
      matched_prompt_bank: true
    cross_family_unseen_prompt:
      role: robustness
      split: stratified_group_k_fold
      grouping_key: prompt_id
      directions:
        - llama_to_gemma
        - gemma_to_llama
  primary_metrics:
    - balanced_accuracy
    - macro_f1
    - roc_auc

length_sensitivity:
  required: true
  actual_word_count_audited: true
  variants:
    - add_n_words_as_covariate
    - preregistered_length_matched_subset
  silent_truncation_allowed: false

proposal:
  due: 2026-08-31
  supervisor_approval: pending
  previous_topic_change: pending_approval
