project_title: >-
  Interpretable Linguistic Fingerprints of Earlier and Later Open-Weight
  LLM Versions: A Controlled Replication across Writing Tasks
design_status: simplified_pending_supervisor_and_pilot
primary_question: >-
  Can earlier and later versions within the Llama and Gemma families be
  distinguished using a small set of interpretable linguistic features, and
  how robust is this distinction across unseen prompts and writing-task types?
language: en
prompt_count: 100
task_types:
  explanation: 20
  narrative: 20
  argumentation: 20
  advice: 20
  reflection: 20
target_words:
  min: 120
  max: 150
responses_per_prompt_model: 1
random_seed: 42
spacy_model: en_core_web_sm

generation:
  runtime: ollama
  endpoint: /api/chat
  temperature: 0
  top_p: 1
  top_k: 40
  repeat_penalty: 1
  seed: 42
  num_ctx: 4096
  num_predict: 384
  system_prompt: >-
    Follow the user's writing instruction. Produce only the requested text,
    without discussing the instruction or identifying yourself.

pilot:
  prompts: 20
  expected_responses: 80
  minimum_ok_rate: 0.95
  minimum_length_compliance: 0.80
  maximum_model_refusal_or_format_failure: 0.10

features:
  confirmatory_count: 15
  confirmatory:
    - n_sentences
    - mean_word_chars
    - mean_sentence_words
    - sd_sentence_words
    - mattr_50
    - repeated_token_rate
    - repeated_bigram_rate
    - function_word_prop
    - modal_prop
    - connective_prop
    - punctuation_prop
    - adjacent_sentence_lexical_overlap
    - upos_ADJ_prop
    - upos_NOUN_prop
    - upos_VERB_prop
  mattr_window: 50
  manual_audit_fraction: 0.10
  audit_only:
    - n_surface_tokens
    - n_words
    - raw_ttr

inference:
  unit: prompt_id
  contrast: later_minus_earlier_within_family
  report_separately_by_family: true
  bootstrap_repetitions: 10000
  paired_test: paired_t_test
  multiple_testing: bonferroni
  alpha: 0.05
  universal_generation_claim_allowed: false

classification:
  estimator: logistic_regression_l2
  C: 1.0
  cv_folds: 5
  grouping_key: prompt_id
  baseline: stratified_dummy
  protocols:
    within_family_prompt_blocked:
      role: primary
      split: stratified_group_k_fold
      report_separately_by_family: true
    leave_one_task_type_out:
      role: robustness
      train_task_types: 4
      test_task_types: 1
      report_separately_by_family: true
  primary_metrics:
    - balanced_accuracy
    - macro_f1
  supporting_outputs:
    - fold_scores
    - confusion_matrix

length_sensitivity:
  required: true
  actual_word_count_audited: true
  variants:
    - add_n_words_as_covariate
    - preregistered_length_matched_subset
  silent_truncation_allowed: false

exploration:
  pca: optional
  clustering: out_of_scope
  mixed_effects: out_of_scope
  cross_family_transfer: out_of_scope

proposal:
  due: 2026-08-31
  supervisor_approval: pending
  previous_topic_change: pending_approval
